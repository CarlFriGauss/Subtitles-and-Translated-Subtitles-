name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and a font with Hebrew glyphs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install SubGen with test and cloud extras
        run: python -m pip install -e ".[dev,cloud]"

      - name: Lint (syntax errors and invalid comparisons only, for now)
        run: python -m ruff check --select E9,F63,F7 .

      - name: Check version strings
        run: python scripts/check_versions.py

      - name: Run tests
        run: python -m pytest -q

  rust:
    name: Desktop shell (cargo test)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: Create placeholder bundle resources
        shell: pwsh
        run: |
          foreach ($dir in "backend", "ffmpeg", "licenses") {
            $path = "desktop/src-tauri/resources/$dir"
            New-Item -ItemType Directory -Force $path | Out-Null
            Set-Content -Path "$path/.placeholder" -Value "ci"
          }

      - name: cargo test
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
